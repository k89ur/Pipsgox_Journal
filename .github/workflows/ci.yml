name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipsgox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pipsgox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pipsgox_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate

      - name: Verify PostgreSQL schema
        working-directory: backend
        run: node dist/db/integration-check.js

      - name: Run unit tests
        working-directory: backend
        run: npm test
