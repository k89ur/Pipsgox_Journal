name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  validate:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate JavaScript
        working-directory: frontend
        run: npm run check
      - name: Validate required frontend files
        run: test -f frontend/index.html && test -f frontend/styles.css && test -f frontend/config.js
